name: Browser Extension Release

# Runs automatically on tag push (v*) or manual workflow dispatch.
# Packages the browser extension into a store-ready ZIP and deploys to
# Chrome Web Store and Firefox Add-ons (AMO).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browser-extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install dependencies
        run: |
          cd browser-extension
          npm ci

      - name: Typecheck
        run: |
          cd browser-extension
          npm run compile

      - name: Package extension ZIP
        run: |
          cd browser-extension
          npm run pack

      - name: Upload Browser Extension ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-zip
          path: browser-extension/notebookawesome-browser-extension.zip
          retention-days: 7

  publish-chrome-web-store:
    needs: package-browser-extension
    runs-on: ubuntu-latest
    env:
      EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-extension-zip
      - name: Publish to Chrome Web Store
        if: ${{ env.EXTENSION_ID != '' && env.CLIENT_ID != '' }}
        continue-on-error: true
        run: npx chrome-webstore-upload-cli@3 upload --source notebookawesome-browser-extension.zip --extension-id "$EXTENSION_ID" --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET" --refresh-token "$REFRESH_TOKEN" --auto-publish

  publish-firefox-addons:
    needs: package-browser-extension
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install dependencies and build
        run: |
          cd browser-extension
          npm ci
          npm run build
      - name: Publish to Firefox Add-ons (AMO)
        if: ${{ env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != '' }}
        run: |
          cd browser-extension
          npx web-ext sign --source-dir . --channel listed --amo-metadata amo-metadata.json --api-key "$WEB_EXT_API_KEY" --api-secret "$WEB_EXT_API_SECRET" --no-input
