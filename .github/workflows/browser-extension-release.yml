name: Browser Extension Release

# Runs automatically on tag push (v*) or manual workflow dispatch.
# Packages the browser extension into a store-ready ZIP and deploys to
# Chrome Web Store, Microsoft Edge Add-ons, and Firefox Add-ons (AMO).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browser-extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install dependencies
        run: |
          cd browser-extension
          npm ci

      - name: Typecheck
        run: |
          cd browser-extension
          npm run compile

      - name: Package extension ZIP
        run: |
          cd browser-extension
          npm run pack

      - name: Upload Browser Extension ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-zip
          path: browser-extension/notebookawesome-browser-extension.zip
          retention-days: 7

  publish-chrome-web-store:
    needs: package-browser-extension
    runs-on: ubuntu-latest
    env:
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-extension-zip
      - name: Publish to Chrome Web Store
        if: ${{ env.CHROME_CLIENT_ID != '' && env.CHROME_EXTENSION_ID != '' }}
        uses: cardinalby/chrome-extension-upload-action@v2
        with:
          clientId: ${{ secrets.CHROME_CLIENT_ID }}
          clientSecret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refreshToken: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extensionId: ${{ secrets.CHROME_EXTENSION_ID }}
          filePath: notebookawesome-browser-extension.zip

  publish-edge-addons:
    needs: package-browser-extension
    runs-on: ubuntu-latest
    env:
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-extension-zip
      - name: Publish to Microsoft Edge Add-ons
        if: ${{ env.EDGE_PRODUCT_ID != '' }}
        uses: cardinalby/edge-addon-deploy-action@v1
        with:
          productId: ${{ secrets.EDGE_PRODUCT_ID }}
          clientId: ${{ secrets.EDGE_CLIENT_ID }}
          clientSecret: ${{ secrets.EDGE_CLIENT_SECRET }}
          tenantId: ${{ secrets.EDGE_TENANT_ID }}
          zipFilePath: notebookawesome-browser-extension.zip

  publish-firefox-addons:
    needs: package-browser-extension
    runs-on: ubuntu-latest
    env:
      FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
      FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-extension-zip
      - name: Publish to Firefox Add-ons (AMO)
        if: ${{ env.FIREFOX_API_KEY != '' && env.FIREFOX_API_SECRET != '' }}
        uses: cardinalby/webext-buildtools-deploy-firefox-addon-action@v2
        with:
          zipFilePath: notebookawesome-browser-extension.zip
          apiKey: ${{ secrets.FIREFOX_API_KEY }}
          apiSecret: ${{ secrets.FIREFOX_API_SECRET }}
